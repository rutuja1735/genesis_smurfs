[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgaurd-phases-01-09"
version = "0.1.0"
description = "Agentgaurd plan-first defense, OpenRouter client, mock agents, AgentDojo adapter, and local API"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "networkx>=3.0,<4",
  "openai>=1.30,<3",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "demo*", "agents*", "data*", "tasks*", "attacks*", "baselines*", "eval*", "api*", "agentdojo_adapter*"]

[tool.setuptools.package-data]
data = ["*.json"]
